services:
  postgres:
    image: postgres:16
    container_name: xiaoliang-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: xiaoliang
      POSTGRES_USER: xiaoliang
      POSTGRES_PASSWORD: xiaoliang
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
[project]
name = "xiaoliang-cad-bridge"
version = "0.1.0"
description = "Authenticated loopback AutoCAD bridge with a dedicated STA executor."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "Pillow==11.1.0",
  "pypdfium2==5.12.1",
  "pydantic==2.9.2",
  "pywin32==308; sys_platform == 'win32'",
  "starlette==0.41.3",
  "uvicorn==0.30.6",
]

[project.optional-dependencies]
dev = [
  "httpx==0.27.2",
  "pytest>=8.2,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

recipe_id: generic.reconcile_counts
version: "1.0.0"
summary: Reconcile independent count bases while preserving conflicts.
task_type: RECONCILE
target_parameterized: true
supported_mutation_policies: [READ_ONLY]
quantity_bases: [DRAWING_OCCURRENCE, UNIQUE_TAG, BOM_DECLARED, PHYSICAL_INSTANCE]
required_capabilities: [semantic.query]
required_rules: [generic.count_reconciliation]
nodes:
  - {node_id: resolve_scope, block_id: scope.resolve, depends_on: []}

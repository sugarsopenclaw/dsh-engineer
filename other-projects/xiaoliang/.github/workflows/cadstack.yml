name: cadstack

on:
  push:
    paths:
      - "cadstack/**"
      - "cadkernel/**"
      - "cadpatterns/**"
      - "cadsemantics/**"
      - "cadtasks/**"
      - ".github/workflows/cadstack.yml"
  pull_request:
    paths:
      - "cadstack/**"
      - "cadkernel/**"
      - "cadpatterns/**"
      - "cadsemantics/**"
      - "cadtasks/**"
      - ".github/workflows/cadstack.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
        working-directory: cadstack
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.9.28"
          enable-cache: true
          cache-dependency-glob: cadstack/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --all-groups

      - name: Run fast verification gate
        run: ./scripts/verify.ps1

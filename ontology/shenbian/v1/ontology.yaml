schema_version: "1.0"
namespace: shenbian.drawing_review
display_name: 沈变图纸审查 Ontology
description: 面向生产用 DXF 图纸净化与铁芯叠片一致性校验的首期运营语义模型。

object_types:
  - id: product_project
    display_name: 产品项目
    identity_property: project_id
    properties: [project_id, project_number, name, lifecycle_status]
  - id: data_asset
    display_name: 数据资产
    identity_property: asset_id
    properties: [asset_id, sha256, media_type, source_kind, sensitivity, storage_ref]
  - id: drawing
    display_name: 图纸
    identity_property: drawing_id
    properties: [drawing_id, drawing_number, name, drawing_kind]
  - id: drawing_revision
    display_name: 图纸版本
    identity_property: revision_id
    properties: [revision_id, revision_code, cad_format, lifecycle_status, source_asset_id]
  - id: extraction_snapshot
    display_name: 抽取快照
    identity_property: snapshot_id
    properties: [snapshot_id, schema_version, extractor_version, host_kind, source_sha256, extracted_at]
  - id: engineering_feature
    display_name: 工程特征
    identity_property: feature_id
    properties: [feature_id, feature_kind, geometry_ref, source_handle, confidence]
  - id: parameter_set
    display_name: 参数集
    identity_property: parameter_set_id
    properties: [parameter_set_id, parameter_kind, version, unit_system, source_asset_id]
  - id: rule_version
    display_name: 规则版本
    identity_property: rule_version_id
    properties: [rule_version_id, rule_id, version, source_clause, applicability, tolerance, lifecycle_status]
  - id: review_task
    display_name: 审查任务
    identity_property: task_id
    properties: [task_id, task_kind, status, created_by, created_at]
  - id: check_run
    display_name: 校验运行
    identity_property: run_id
    properties: [run_id, algorithm_version, status, started_at, completed_at]
  - id: finding
    display_name: 候选发现
    identity_property: finding_id
    properties: [finding_id, finding_kind, severity, confidence, status]
  - id: issue
    display_name: 已确认问题
    identity_property: issue_id
    properties: [issue_id, severity, status, assignee, disposition]
  - id: evidence
    display_name: 证据
    identity_property: evidence_id
    properties: [evidence_id, evidence_kind, observed_value, expected_value, tolerance, artifact_ref]
  - id: artifact
    display_name: 交付产物
    identity_property: artifact_id
    properties: [artifact_id, artifact_kind, sha256, storage_ref, validation_status]
  - id: approval
    display_name: 审批记录
    identity_property: approval_id
    properties: [approval_id, decision, decided_by, decided_at, reason]

link_types:
  - { id: drawing_belongs_to_project, from: drawing, to: product_project }
  - { id: revision_of_drawing, from: drawing_revision, to: drawing }
  - { id: revision_backed_by_asset, from: drawing_revision, to: data_asset }
  - { id: snapshot_extracted_from_revision, from: extraction_snapshot, to: drawing_revision }
  - { id: feature_observed_in_snapshot, from: engineering_feature, to: extraction_snapshot }
  - { id: parameter_set_describes_revision, from: parameter_set, to: drawing_revision }
  - { id: task_uses_revision, from: review_task, to: drawing_revision }
  - { id: run_executes_task, from: check_run, to: review_task }
  - { id: run_applies_rule, from: check_run, to: rule_version }
  - { id: finding_produced_by_run, from: finding, to: check_run }
  - { id: finding_targets_feature, from: finding, to: engineering_feature }
  - { id: finding_supported_by_evidence, from: finding, to: evidence }
  - { id: issue_confirmed_from_finding, from: issue, to: finding }
  - { id: artifact_derived_from_revision, from: artifact, to: drawing_revision }
  - { id: artifact_validated_by_run, from: artifact, to: check_run }
  - { id: approval_authorizes_artifact, from: approval, to: artifact }

action_types:
  - id: create_dxf_purification_task
    display_name: 新建 DXF 净化任务
    risk: reversible_write
    requires_approval: false
    input_types: [drawing_revision]
    output_types: [review_task]
  - id: confirm_manufacturing_region
    display_name: 确认制造区域
    risk: reversible_write
    requires_approval: true
    input_types: [review_task, engineering_feature]
    output_types: [engineering_feature]
  - id: preview_dxf_purification
    display_name: 预览 DXF 净化
    risk: read_only
    requires_approval: false
    input_types: [review_task]
    output_types: [artifact, finding]
  - id: generate_dwg_working_copy
    display_name: 生成 DWG 工作副本
    risk: reversible_write
    requires_approval: true
    input_types: [review_task, approval]
    output_types: [artifact]
  - id: validate_manufacturing_geometry
    display_name: 校验制造几何
    risk: read_only
    requires_approval: false
    input_types: [artifact, drawing_revision]
    output_types: [check_run, finding, evidence]
  - id: export_production_dxf
    display_name: 导出生产 DXF
    risk: external_side_effect
    requires_approval: true
    input_types: [artifact, check_run, approval]
    output_types: [artifact]
  - id: create_lamination_review_task
    display_name: 新建铁芯叠片校验任务
    risk: reversible_write
    requires_approval: false
    input_types: [drawing_revision, parameter_set]
    output_types: [review_task]
  - id: pair_drawing_and_parameter_versions
    display_name: 配对图纸与参数版本
    risk: reversible_write
    requires_approval: true
    input_types: [review_task, drawing_revision, parameter_set]
    output_types: [review_task]
  - id: reconstruct_expected_lamination
    display_name: 重建预期叠片
    risk: read_only
    requires_approval: false
    input_types: [parameter_set]
    output_types: [engineering_feature, artifact]
  - id: align_lamination_views
    display_name: 对齐铁芯视图
    risk: reversible_write
    requires_approval: true
    input_types: [review_task, engineering_feature]
    output_types: [engineering_feature]
  - id: run_lamination_consistency_check
    display_name: 执行铁芯叠片一致性校验
    risk: read_only
    requires_approval: false
    input_types: [review_task, rule_version]
    output_types: [check_run, finding, evidence]
  - id: disposition_finding
    display_name: 处置候选发现
    risk: reversible_write
    requires_approval: true
    input_types: [finding, approval]
    output_types: [finding, issue]
  - id: rerun_review_task
    display_name: 重新执行审查任务
    risk: read_only
    requires_approval: false
    input_types: [review_task]
    output_types: [check_run, finding]
  - id: publish_review_report
    display_name: 发布校审报告
    risk: external_side_effect
    requires_approval: true
    input_types: [review_task, check_run, approval]
    output_types: [artifact]


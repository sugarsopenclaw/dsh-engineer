[project]
name = "shenbian-api"
version = "0.1.0"
description = "沈变工程图纸 Ontology 与审查任务后端"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alembic>=1.16.0",
    "alibabacloud-oss-v2",
    "asyncpg>=0.30.0",
    "fastapi>=0.116.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "redis>=6.2.0",
    "sqlalchemy[asyncio]>=2.0.42",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
shenbian-api = "shenbian_api.cli:main"

[dependency-groups]
dev = [
    "httpx2",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shenbian_api"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

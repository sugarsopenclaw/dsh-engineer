[project]
name = "shenbian-api"
version = "0.4.0"
description = "沈变 Harness Agent 的共享 API 与模型网关"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "alibabacloud-oss-v2",
    "fastapi>=0.116.0",
    "httpx2>=2.12.0",
    "pydantic-settings>=2.10.0",
    "pyyaml>=6.0.2",
    "redis>=6.2.0",
    "sqlalchemy[asyncio]>=2.0.42",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
shenbian-api = "shenbian_api.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "pytest-asyncio>=1.1.0",
    "ruff>=0.12.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "shenbian_api"
module-root = "src"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/test_sqlite_query_layer.py" = ["E402"]
